<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lithium AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #0a0f14, #030507);
  color: #e6edf3;
}

/* CENTER LOGO */
.logo {
  text-align: center;
  margin-top: 80px;
}

.logo-box {
  width: 90px;
  height: 90px;
  margin: auto;
  background: linear-gradient(135deg, #1da1ff, #0066ff);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 800;
  color: white;
  box-shadow: 0 0 40px rgba(0,150,255,0.6);
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: 50px auto;
  padding: 20px;
}

.card {
  background: rgba(10,15,20,0.9);
  border: 1px solid rgba(0,150,255,0.2);
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 25px rgba(0,150,255,0.4);
}

.card-icon {
  font-size: 24px;
  margin-bottom: 10px;
  color: #00aaff;
}

/* CHAT BAR */
.chat-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 900px;
  display: flex;
  align-items: center;
  background: rgba(10,15,20,0.95);
  border: 1px solid rgba(0,150,255,0.2);
  border-radius: 50px;
  padding: 10px 15px;
  backdrop-filter: blur(10px);
}

.chat-bar input {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  outline: none;
}

.send-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00aaff, #0066ff);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-left: 10px;
}

.send-btn:hover {
  box-shadow: 0 0 15px rgba(0,150,255,0.7);
}

/* CHAT WINDOW */
.chat-window {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 900px;
  height: 300px;
  background: rgba(10,15,20,0.95);
  border: 1px solid rgba(0,150,255,0.2);
  border-radius: 16px;
  overflow-y: auto;
  padding: 15px;
  display: none;
}

.message {
  margin: 10px 0;
}

.user { color: white; }
.ai { color: #00aaff; }

</style>
</head>

<body>

<div class="logo">
  <div class="logo-box">Li</div>
</div>

<div class="cards">
  <div class="card" onclick="quick('Stress test neural tiers')">
    <div class="card-icon">⚡</div>
    Stress-test Neural Tiers
  </div>

  <div class="card" onclick="quick('Develop new neural ion')">
    <div class="card-icon">🧠</div>
    Develop New Neural Ion
  </div>

  <div class="card" onclick="quick('Create visual synthesis')">
    <div class="card-icon">🖼️</div>
    Synthesize New Visual
  </div>

  <div class="card" onclick="quick('Check system status')">
    <div class="card-icon">🛡️</div>
    Check System Status
  </div>
</div>

<div class="chat-window" id="chat"></div>

<div class="chat-bar">
  <input id="input" placeholder="Sequence active on Full Logic Mode..." />
  <div class="send-btn" onclick="send()">➤</div>
</div>

<script>
function addMessage(text, type) {
  const chat = document.getElementById("chat");
  chat.style.display = "block";

  const msg = document.createElement("div");
  msg.className = "message " + type;
  msg.innerText = text;

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage("You: " + text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage("Lithium: " + aiResponse(text), "ai");
  }, 500);
}

function quick(text) {
  document.getElementById("input").value = text;
  send();
}

function aiResponse(input) {
  input = input.toLowerCase();

  if (input.includes("status")) return "All systems operational.";
  if (input.includes("neural")) return "Neural ion initialized.";
  if (input.includes("visual")) return "Rendering visual synthesis...";
  
  return "Processing: " + input;
}
</script>

</body>
</html>
